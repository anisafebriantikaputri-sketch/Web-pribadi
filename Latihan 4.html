/* SIDEBAR */
.sidebar{
width:260px;
background:#89A6A8;
padding:20px;
color:white;

}

.sidebar img{

.menu a{
display:block;
padding:12px;

color:white;
transition:0.3s;

}

.menu a:hover{
background:#496A74;
padding-left:18px;
}

/* CONTENT */
.content{
flex:1;
padding:80px;
animation:slideKanan 1s ease;
}

/* FOTO + TEKS */
.home-box{
display:flex;
align-items:center;
gap:40px;
}

.home-box img{
width:300px;
border-radius:10px;
box-shadow:0 6px 15px rgba(0,0,0,0.2);
}

h1{
color:#496A74;
}

p{
color:#2f3e40;
}

/* ANIMASI */
@keyframes slideKiri{
from{
opacity:0;
transform:translateX(-50px);
}
to{
opacity:1;
transform:translateX(0);
}
}

@keyframes slideKanan{
from{
opacity:0;
transform:translateX(50px);
}
to{
opacity:1;
transform:translateX(0);
}
}
